services:
  - type: web
    name: safe-ai-mailroom-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_PATH
        # Free Render services do not provide /var/data unless a paid
        # persistent disk is attached. /tmp is writable at runtime; keep one
        # worker so SQLite remains consistent for the service lifetime.
        value: /tmp/safe-ai-mailroom.sqlite3
      - key: LOG_LEVEL
        value: INFO
